services:
  - type: web
    name: airbnb-clone-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/airbnb.db
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: airbnb-data
      mountPath: /var/data
      sizeGB: 1
